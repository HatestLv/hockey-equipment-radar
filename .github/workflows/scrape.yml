name: Scrape Hockey Data

on:
  schedule:
    # 4 reizes dienā: ~06:07, 11:07, 16:07, 21:07 UTC
    # (minūte 07, nevis 00 — GitHub pilnās stundas palaišanas bieži aizkavē vai izlaiž)
    - cron: '7 6,11,16,21 * * *'
  workflow_dispatch: # Poga manuālai palaišanai un testēšanai no GitHub paneļa

permissions:
  contents: write

# Neļauj divām skenēšanām darboties vienlaicīgi (citādi otrā nevar izdarīt push)
concurrency:
  group: scrape-data
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Lejupielādēt kodu (Checkout)
        uses: actions/checkout@v4

      - name: Uzstādīt Python vidi
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalēt nepieciešamās bibliotēkas
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Izpildīt veikalu skenēšanu
        run: python scraper.py

      - name: Saglabāt un nosūtīt atjauninātos datus uz repozitoriju
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraped_data.json
          if git diff --staged --quiet; then
            echo "Cenu un noliktavas izmaiņas nav konstatētas."
          else
            git commit -m "Automātisks datu atjauninājums: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Ja skenēšanas laikā repozitorijā kaut kas mainīts (piem. tu iepušoji index.html),
            # vispirms paņem jaunākās izmaiņas, tad sūta — citādi push tiek noraidīts
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
