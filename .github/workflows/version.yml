name: Lapas versija

# Pēc katra lapas koda atjauninājuma automātiski palielina versiju version.json.
# Commit ziņojumā var norādīt: [major] / [minor] / [skip-version]  (bez atzīmes = mazs labojums)
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'config.json'

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  bump:
    # Neskaita pašas automātikas commitus (skrāperis, versijas maiņa)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Palielināt versiju
        run: python scripts/bump_version.py

      - name: Saglabāt version.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --staged --quiet; then
            echo "Versija nav mainīta."
          else
            git commit -m "Versija $(python -c "import json;print(json.load(open('version.json'))['version'])")"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
