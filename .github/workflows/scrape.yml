name: Scrape Hockey Data

on:
  schedule:
    # Izpildās 4 reizes dienā: 06:00, 11:00, 16:00 un 21:00 UTC
    - cron: '0 6,11,16,21 * * *'
  workflow_dispatch: # Poga manuālai palaišanai un testēšanai no GitHub paneļa

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Lejupielādēt kodu (Checkout)
        uses: actions/checkout@v4

      - name: Uzstādīt Python vidi
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalēt nepieciešamās bibliotēkas
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Izpildīt veikalu skenēšanu
        run: python scraper.py

      - name: Saglabāt un nosūtīt atjauninātos datus uz repozitoriju
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraped_data.json
          if git diff --staged --quiet; then
            echo "Cenu un noliktavas izmaiņas nav konstatētas."
          else
            git commit -m "Automātisks datu atjauninājums: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
